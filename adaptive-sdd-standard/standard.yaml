standard:
  id: adaptive-sdd-standard
  displayName: Adaptive SDD Standard
  version: 1
  language: zh-CN

adoptionTemplate: templates/adoption.md

agent:
  entrypoint: guide/agent-adoption.md
  requiredReads:
    - standard.yaml
    - reference/core-principles.md
    - reference/artifact-authority.md
    - reference/profiles.md
    - reference/execution-intent.md
    - reference/lifecycle.md
    - reference/contracts.md
    - guide/choose-profile.md
    - guide/adopt-sdd.md
    - templates/adoption.md
  confirmationRequiredBeforeProjectWrites: true

profiles:
  quick-change:
    persistence: spec-first
    requiredTemplates:
      - templates/quick-change/change.md
      - templates/quick-change/tasks.md
    conditionalTemplates:
      - templates/modules/adr/decision.md
      - templates/modules/contract-first/contract-delta.md

  living-spec:
    persistence: spec-anchored
    requiredTemplates:
      - templates/living-spec/capability-spec.md
      - templates/living-spec/proposal.md
      - templates/living-spec/spec-delta.md
      - templates/living-spec/tasks.md
    conditionalTemplates:
      - templates/living-spec/design.md
      - templates/living-spec/verification.md
      - templates/modules/adr/decision.md
      - templates/modules/contract-first/contract-delta.md

  governed-delivery:
    persistence: spec-anchored
    requiredTemplates:
      - templates/governed-delivery/capability-spec.md
      - templates/governed-delivery/proposal.md
      - templates/governed-delivery/spec-delta.md
      - templates/governed-delivery/tasks.md
      - templates/governed-delivery/verification-plan.md
      - templates/governed-delivery/release-decision.md
    conditionalTemplates:
      - templates/governed-delivery/design.md
      - templates/governed-delivery/migration-rollback.md
      - templates/modules/adr/decision.md
      - templates/modules/contract-first/contract-delta.md

modules:
  adr:
    template: templates/modules/adr/decision.md
  contract-first:
    templates:
      - templates/modules/contract-first/contract-record.md
      - templates/modules/contract-first/contract-delta.md

executionIntents:
  default: delivery
  values:
    probe:
      confidenceTarget: directional
    delivery:
      confidenceTarget: reasonable
    assurance:
      confidenceTarget: high

examples:
  - id: html-to-design-penpot
    path: examples/html-to-design-penpot/README.md
    sourceRepository: html-to-design-penpot
    sourceCommit: ca8b897
